name: CI

on: [push, pull_request]

jobs:
  backend:
    runs-on: ubuntu-latest
    # All backend commands run with working-directory `backend/`.
    # Required: tests do `from app.main import ...`, so running pytest from
    # the repo root (e.g. `pytest backend/tests`) triggers import shadowing
    # and collection failures. Always run pytest from inside `backend/`.
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install -r requirements.txt
      - run: python -m pytest tests -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm install
      - run: npm test
      - run: npm run build
